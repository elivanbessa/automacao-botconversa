name: Automacao BotConversa

on:
  schedule:
    - cron: '0 11 * * *'  # 08:00 AM (Horário de Brasília)
    - cron: '0 21 * * *'  # 18:00 PM (Horário de Brasília)
  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Executar Automacao
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_SENHA: ${{ secrets.BOT_SENHA }}
        run: |
          HORA=$(date +%H)
          if [ "$HORA" -eq 11 ]; then
            python bot.py start
          else
            python bot.py stop
          fi
